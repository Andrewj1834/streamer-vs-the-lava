<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Streamer vs The Lava</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040208;color:#fff;font-family:system-ui,Arial}#g{position:relative;width:100vw;height:100vh;max-width:1080px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 22%,#28104e,#090516 45%,#020105 80%)}.grid{position:absolute;inset:40% -50% -25%;background-image:linear-gradient(#8d32c755 1px,transparent 1px),linear-gradient(90deg,#8d32c755 1px,transparent 1px);background-size:70px 70px;transform:perspective(520px) rotateX(62deg);transform-origin:top;animation:grid 5s linear infinite}@keyframes grid{to{background-position:0 70px,70px 0}}.hud{position:absolute;z-index:20;top:2%;left:3%;right:3%;display:flex;justify-content:space-between;gap:10px}.card{background:#090718cc;border:1px solid #4ffcff;border-radius:16px;padding:12px 18px;font-weight:900;font-size:clamp(14px,2.8vw,30px);box-shadow:0 0 20px #4ffcff22}.sub{position:absolute;z-index:20;top:8%;left:3%;font-weight:800;font-size:clamp(11px,1.8vw,19px)}#danger{position:absolute;z-index:21;top:8%;right:3%;padding:8px 12px;border:1px solid #4ffcff;border-radius:999px;font-weight:1000}.avatar{position:absolute;z-index:10;left:50%;top:29%;transform:translate(-50%,-50%);text-align:center}.head{width:clamp(78px,12vw,130px);height:clamp(78px,12vw,130px);border-radius:50%;background:linear-gradient(135deg,#62ffff,#a83cff);border:4px solid #fff;box-shadow:0 0 30px #a83cff;margin:auto}.platform{width:clamp(190px,32vw,360px);height:34px;border-radius:50%;background:#17102e;border:3px solid #4ffcff;box-shadow:0 0 28px #4ffcff;margin-top:12px}.tag{font-weight:1000;letter-spacing:.15em;margin-top:8px}.queue{position:absolute;z-index:25;right:2%;top:13%;width:min(42%,370px);background:#080617c9;border:1px solid #a83cff;border-radius:15px;padding:10px;backdrop-filter:blur(8px)}.queue h3{margin:0 0 6px;color:#dfb7ff;font-size:clamp(11px,2vw,21px)}.q{padding:7px 3px;border-top:1px solid #38235a;font-size:clamp(10px,1.6vw,17px)}.save{color:#70ffdb}.sab{color:#ff8068}#lava{position:absolute;z-index:5;bottom:0;left:0;width:100%;height:18%;transition:height .22s ease;background:linear-gradient(#ffd125,#ff6500 12%,#d71900 58%,#590500);box-shadow:0 -14px 45px #ff5a00}#lava:before,#lava:after{content:"";position:absolute;left:-10%;top:-22px;width:120%;height:44px;border-radius:45%;background:#ff9d00;animation:wave 2.5s ease-in-out infinite alternate;filter:drop-shadow(0 0 14px #ff5a00)}#lava:after{top:-10px;opacity:.6;animation-duration:1.8s}@keyframes wave{to{transform:translateX(3%) scaleY(1.25)}}#toast{position:absolute;z-index:40;left:50%;bottom:30%;transform:translateX(-50%);font-size:clamp(20px,5vw,52px);font-weight:1000;text-align:center;text-shadow:0 0 20px currentColor;pointer-events:none}#em{display:none;position:absolute;z-index:42;top:20%;left:50%;transform:translateX(-50%);width:90%;text-align:center;color:#ff3c1c;font-size:clamp(28px,7vw,72px);font-weight:1000;text-shadow:0 0 24px #ff2500;animation:p .35s infinite alternate}@keyframes p{to{transform:translateX(-50%) scale(1.05)}}#over,#count{display:none;position:absolute;z-index:100;inset:0;background:#08020be8;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:1000}#over{font-size:clamp(38px,9vw,96px);color:#ff401d;text-shadow:3px 0 #4ffcff,-3px 0 #a83cff}#count{font-size:clamp(30px,7vw,70px)}#count b{font-size:clamp(110px,26vw,280px);color:#ff681c}#admin{display:none;position:absolute;z-index:150;inset:5%;overflow:auto;background:#080715f2;border:2px solid #a83cff;border-radius:20px;padding:20px}input,select,button{border:1px solid #655080;background:#171027;color:#fff;border-radius:9px;padding:10px;font:inherit}button{font-weight:900;cursor:pointer}.row{display:grid;grid-template-columns:1.2fr 1fr .7fr auto;gap:7px;margin:7px 0}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px}label{display:block;margin-top:14px}input[type=range]{width:100%}@media(max-width:600px){.row{grid-template-columns:1fr 1fr}.queue{width:46%}}</style></head><body><div id="g"><div class="grid"></div><div class="hud"><div class="card">⏱ <span id="time">00:00</span></div><div class="card">🌋 <span id="pct">18.0</span>%</div></div><div class="sub">Goal <span id="goal">05:00</span> • PB <span id="pb">00:00</span></div><div id="danger">STABLE</div><div class="avatar" id="av"><div class="head"></div><div class="platform"></div><div class="tag">STREAMER</div></div><div class="queue"><h3>⚡ PENDING CLAIMS</h3><div id="ql">Waiting for gifts…</div></div><div id="toast"></div><div id="em">🚨 LAST CHANCE 🚨<br><small>CHAT, SAVE THE STREAMER!</small></div><div id="lava"></div><div id="count">STREAMER vs THE LAVA<b id="cn">3</b><small>GIFTS WAIT • VIEWER TYPES !claim</small></div><div id="over"></div><div id="admin"><h2>Streamer Admin</h2><p>Press A to close. Settings save automatically.</p><label>Base rise <b id="so"></b>%/sec</label><input id="speed" type="range" min="0" max="5" step=".05"><label>Target survival <b id="to"></b> sec</label><input id="target" type="range" min="30" max="1800" step="30"><h3>Gift rules</h3><div id="rules"></div><button id="add">＋ Add Gift</button><div class="controls"><button onclick="start()">Start / Countdown</button><button onclick="mod(5)">+5% Lava</button><button onclick="mod(-5)">-5% Lava</button><button onclick="pause()" id="pa">Pause</button><button onclick="reset()">Reset</button></div><h3>Event simulator</h3><div class="row"><input id="su" value="TestViewer"><input id="sg" value="Rose"><button onclick="gift(su.value,sg.value)">Send Gift</button><button onclick="chat(su.value,'!claim')">!claim</button></div></div></div><script>const $=s=>document.querySelector(s),C=(v,a,b)=>Math.max(a,Math.min(b,v)),F=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');const DEF={speed:1,target:300,rules:[{name:'Rose',type:'save',value:2},{name:'TikTok',type:'save',value:2},{name:'Weights',type:'sabotage',value:10}]};let cfg=JSON.parse(localStorage.getItem('lavaCfg')||'null')||DEF,lava=18,elapsed=0,state='ready',queue=[],claimed=new Set(),last=performance.now(),nextSurge=60,surgeUntil=0,pb=+localStorage.getItem('lavaPB')||0;function save(){localStorage.setItem('lavaCfg',JSON.stringify(cfg))}function user(u){return String(u||'').trim().replace(/^@+/,'').toLowerCase()}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function level(){return lava>=95?['MELTDOWN','#ff2500']:lava>=85?['CRITICAL','#ff4b22']:lava>=70?['DANGER','#ff9a22']:lava>=50?['RISING','#ffe15a']:['STABLE','#4ffcff']}function render(){lava=C(lava,0,100);$('#lava').style.height=lava+'%';$('#pct').textContent=lava.toFixed(1);$('#time').textContent=F(elapsed);$('#goal').textContent=F(cfg.target);$('#pb').textContent=F(Math.max(pb,elapsed));let d=level();$('#danger').textContent=d[0];$('#danger').style.color=d[1];$('#danger').style.borderColor=d[1];$('#em').style.display=lava>=95&&state==='run'?'block':'none';let n=Date.now();queue=queue.filter(x=>n-x.at<90000);$('#ql').innerHTML=queue.length?queue.slice(-5).reverse().map(x=>`<div class="q ${x.type==='save'?'save':'sab'}"><b>${esc(x.user)}</b>: ${esc(x.gift)} • ${x.type==='save'?'−':'+'}${x.value}%<br><small>${Math.ceil((90000-(n-x.at))/1000)}s • type !claim</small></div>`).join(''):'Waiting for gifts…'}function toast(t,good=true){let e=$('#toast');e.textContent=t;e.style.color=good?'#63ffe1':'#ff7654';e.animate([{opacity:0,transform:'translate(-50%,25px)'},{opacity:1,transform:'translate(-50%,0) scale(1.08)'},{opacity:0,transform:'translate(-50%,-25px)'}],{duration:1500})}function mod(v,msg){if(state==='over')return;lava=C(lava+v,0,100);toast(msg||`${v>0?'+':''}${v}%`,v<=0);if(lava>=100)over();render()}function over(){state='over';if(elapsed>pb){pb=elapsed;localStorage.setItem('lavaPB',pb);$('#over').innerHTML=`NEW RECORD!<br><small>${F(elapsed)}</small>`}else $('#over').innerHTML=`STREAMER WAS<br>CONSUMED!<br><small>${F(elapsed)}</small>`;$('#over').style.display='flex'}async function start(){if(state==='run')return;$('#over').style.display='none';let c=$('#count');c.style.display='flex';for(let x of ['3','2','1','GO!']){$('#cn').textContent=x;await new Promise(r=>setTimeout(r,x==='GO!'?600:750))}c.style.display='none';state='run';last=performance.now()}function reset(){lava=18;elapsed=0;queue=[];claimed.clear();nextSurge=60;surgeUntil=0;state='ready';$('#over').style.display='none';render();start()}function pause(){if(state==='over')return;state=state==='pause'?'run':'pause';$('#pa').textContent=state==='pause'?'Resume':'Pause'}function gift(username,name){if(state==='over')return false;let r=cfg.rules.find(x=>x.name.toLowerCase()===String(name).toLowerCase());if(!r)return false;queue.push({id:Date.now()+'-'+Math.random(),user:user(username),gift:r.name,type:r.type,value:+r.value,at:Date.now()});if(queue.length>50)queue.shift();render();return true}function chat(username,msg){if(String(msg).trim().toLowerCase()!=='!claim'||state==='over')return false;let u=user(username),i=queue.findIndex(x=>x.user===u&&!claimed.has(x.id));if(i<0)return false;let q=queue.splice(i,1)[0];claimed.add(q.id);let v=q.type==='save'?-Math.abs(q.value):Math.abs(q.value);mod(v,`${q.user} CLAIMED ${q.gift}! ${v>0?'+':''}${v}%`);$('#av').animate(q.type==='save'?[{filter:'none'},{filter:'drop-shadow(0 0 35px #4fffc4)',transform:'translate(-50%,-50%) scale(1.08)'},{filter:'none'}]:[{filter:'none'},{filter:'brightness(2)',transform:'translate(-50%,-50%) scale(1.12)'},{filter:'none'}],{duration:650});return true}window.receiveGift=gift;window.receiveChat=chat;window.gift=gift;window.chat=chat;window.mod=mod;window.reset=reset;window.start=start;window.pause=pause;function loop(now){let dt=Math.min((now-last)/1000,.1);last=now;if(state==='run'){elapsed+=dt;if(elapsed>=nextSurge){surgeUntil=elapsed+10;nextSurge+=60;toast('⚠ LAVA SURGE • 10 SECONDS',false)}lava+=cfg.speed*(elapsed<surgeUntil?2.25:1)*dt;if(lava>=100)over()}render();requestAnimationFrame(loop)}function ar(){speed.value=cfg.speed;target.value=cfg.target;so.textContent=cfg.speed;to.textContent=cfg.target;rules.innerHTML=cfg.rules.map((r,i)=>`<div class="row"><input data-i="${i}" data-k="name" value="${esc(r.name)}"><select data-i="${i}" data-k="type"><option value="save" ${r.type==='save'?'selected':''}>Save</option><option value="sabotage" ${r.type==='sabotage'?'selected':''}>Sabotage</option></select><input data-i="${i}" data-k="value" type="number" value="${r.value}"><button data-del="${i}">✕</button></div>`).join('')}speed.oninput=e=>{cfg.speed=+e.target.value;so.textContent=cfg.speed;save()};target.oninput=e=>{cfg.target=+e.target.value;to.textContent=cfg.target;save()};rules.oninput=e=>{let i=e.target.dataset.i,k=e.target.dataset.k;if(i!=null&&k){cfg.rules[i][k]=k==='value'?+e.target.value:e.target.value;save()}};rules.onclick=e=>{if(e.target.dataset.del!=null){cfg.rules.splice(+e.target.dataset.del,1);save();ar()}};add.onclick=()=>{cfg.rules.push({name:'New Gift',type:'save',value:2});save();ar()};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='a'&&!/input|select|textarea/i.test(e.target.tagName)){admin.style.display=admin.style.display==='block'?'none':'block';ar()}});ar();render();requestAnimationFrame(loop);setTimeout(start,300)</script></body></html>
