<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Streamer vs The Lava</title><style>*{box-sizing:border-box}body{margin:0;background:#05030b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#g{position:relative;width:100vw;height:100vh;max-width:1080px;margin:auto;background:radial-gradient(circle at 50% 25%,#2b1050,#080514 50%,#020105);overflow:hidden}.grid{position:absolute;inset:38% -45% -25%;background-image:linear-gradient(#a83cff55 1px,transparent 1px),linear-gradient(90deg,#a83cff55 1px,transparent 1px);background-size:65px 65px;transform:perspective(520px) rotateX(62deg);animation:gr 5s linear infinite}@keyframes gr{to{background-position:0 65px,65px 0}}.hud{position:absolute;z-index:20;top:2%;left:3%;right:3%;display:flex;justify-content:space-between;gap:8px}.card{background:#080714c9;border:1px solid #4ffcff;border-radius:14px;padding:10px;font-weight:900;font-size:clamp(13px,2.6vw,28px)}#avatar{position:absolute;z-index:8;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center}.head{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#65ffff,#a83cff);border:4px solid white;box-shadow:0 0 28px #a83cff}.plat{width:260px;height:28px;margin:10px 0 0 -80px;border-radius:50%;background:#17102e;border:3px solid #4ffcff;box-shadow:0 0 25px #4ffcff}#lava{position:absolute;z-index:5;bottom:0;width:100%;height:18%;background:linear-gradient(#ffd32a,#ff6500 12%,#d81700 60%,#560400);box-shadow:0 -12px 40px #ff5a00;transition:height .2s}#lava:before{content:"";position:absolute;left:-10%;top:-20px;width:120%;height:42px;border-radius:50%;background:#ff9d00;animation:w 1.7s ease-in-out infinite alternate}@keyframes w{to{transform:translateX(3%) scaleY(1.3)}}#q{position:absolute;z-index:22;right:2%;top:11%;width:42%;max-width:380px;background:#080714c9;border:1px solid #a83cff;border-radius:14px;padding:10px;font-size:clamp(10px,1.7vw,17px)}#q h3{margin:0 0 8px;color:#ddb0ff}.qi{padding:7px;border-top:1px solid #493064}#status{position:absolute;z-index:20;left:3%;top:9%;font-weight:900;color:#4ffcff}#gear{position:absolute;z-index:50;right:3%;bottom:3%;width:58px;height:58px;border-radius:50%;font-size:26px;background:#100b24;color:white;border:2px solid #4ffcff}#admin{display:none;position:absolute;z-index:80;inset:3%;background:#080714f5;border:2px solid #a83cff;border-radius:18px;padding:18px;overflow:auto}#admin h2{margin:0 0 8px}#close{float:right;font-size:22px}section{margin:14px 0;padding:12px;border:1px solid #ffffff22;border-radius:12px}label{display:block;margin:10px 0 4px}input[type=range]{width:100%}input,select,button{background:#171027;color:#fff;border:1px solid #665080;border-radius:9px;padding:9px}button{font-weight:800}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.good{background:#07513f}.bad{background:#5a130d}.rule{display:grid;grid-template-columns:1fr 1fr 70px auto;gap:5px;margin:6px 0}.toast{position:absolute;z-index:40;left:50%;bottom:30%;transform:translateX(-50%);font-size:clamp(20px,5vw,50px);font-weight:1000;text-align:center;text-shadow:0 0 18px currentColor}.over{display:none;position:absolute;z-index:70;inset:0;background:#090000cc;align-items:center;justify-content:center;text-align:center;font-size:clamp(38px,9vw,90px);font-weight:1000;color:#ff431f}.count{display:none;position:absolute;z-index:90;inset:0;background:#05030bee;align-items:center;justify-content:center;font-size:25vw;font-weight:1000;color:#ff6b19}</style></head><body><div id="g"><div class="grid"></div><div class="hud"><div class="card">⏱ <span id="time">00:00</span></div><div class="card">🌋 <span id="pct">18.0</span>%</div></div><div id="status">STABLE</div><div id="avatar"><div class="head"></div><div class="plat"></div><b>STREAMER</b></div><div id="q"><h3>⚡ PENDING CLAIMS</h3><div id="ql">Waiting for gifts…</div></div><div id="toast" class="toast"></div><div id="lava"></div><button id="gear">⚙️</button><div id="count" class="count">3</div><div id="over" class="over">STREAMER WAS CONSUMED!</div><div id="admin"><button id="close">✕</button><h2>🎛 Streamer Control Centre</h2><small>Settings save on this device.</small><section><b>Round Settings</b><label>Starting lava <span id="so"></span>%</label><input id="start" type="range" min="0" max="80"><label>Rise speed <span id="ro"></span>%/sec</label><input id="rise" type="range" min="0" max="5" step=".05"><label>Claim expiry <span id="eo"></span>s</label><input id="expiry" type="range" min="15" max="180" step="5"><label>Surge interval <span id="io"></span>s</label><input id="interval" type="range" min="20" max="300" step="10"><label>Surge power <span id="mo"></span>x</label><input id="mult" type="range" min="1" max="5" step=".25"></section><section><b>Gift Rules</b><div id="rules"></div><button id="add">＋ Add Gift</button></section><section><b>Manual LIVE Controls</b><div class="buttons"><button onclick="startGame()">Start / Countdown</button><button onclick="pause()">Pause / Resume</button><button class="bad" onclick="change(5)">+5% Lava</button><button class="good" onclick="change(-5)">-5% Lava</button><button onclick="surge()">Trigger Surge</button><button onclick="shield++">Give Shield</button><button class="good" onclick="change(-15)">Emergency Save</button><button class="bad" onclick="gameOver()">End Round</button><button onclick="reset()">Reset Session</button></div></section><section><b>LIVE Event Simulator</b><p><input id="user" value="TestViewer" placeholder="Username"> <input id="gift" value="Rose" placeholder="Gift"></p><div class="buttons"><button onclick="receiveGift(user.value,gift.value)">Send Gift</button><button onclick="receiveChat(user.value,'!claim')">Send !claim</button></div></section></div></div><script>const $=x=>document.querySelector(x),D={start:18,rise:1,expiry:90,interval:60,mult:2.25,rules:[{n:'Rose',t:'save',v:2},{n:'TikTok',t:'save',v:2},{n:'Weights',t:'sabotage',v:10}]};let c=Object.assign(D,JSON.parse(localStorage.getItem('lavaCfg')||'{}')),lava=c.start,sec=0,state='ready',queue=[],last=performance.now(),next=c.interval,boost=0,shield=0;function save(){localStorage.setItem('lavaCfg',JSON.stringify(c))}function fmt(x){x=x|0;return String(x/60|0).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function norm(x){return String(x).trim().replace(/^@/,'').toLowerCase()}function render(){lava=Math.max(0,Math.min(100,lava));$('#lava').style.height=lava+'%';$('#pct').textContent=lava.toFixed(1);$('#time').textContent=fmt(sec);let st=lava>=95?'MELTDOWN':lava>=85?'CRITICAL':lava>=70?'DANGER':lava>=50?'RISING':'STABLE';$('#status').textContent=st;$('#status').style.color=lava>=70?'#ff5a22':'#4ffcff';let now=Date.now();queue=queue.filter(x=>now-x.at<c.expiry*1000);$('#ql').innerHTML=queue.length?queue.slice(-5).reverse().map(x=>`<div class=qi><b>${x.u}</b>: ${x.g} • ${x.t==='save'?'−':'+'}${x.v}%<br><small>${Math.ceil((c.expiry*1000-(now-x.at))/1000)}s • type !claim</small></div>`).join(''):'Waiting for gifts…'}function toast(x){let e=$('#toast');e.textContent=x;e.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:1500})}function change(x){if(x>0&&shield){let b=Math.min(5,x);x-=b;shield--;toast('🛡 SHIELD BLOCKED '+b+'%')}lava+=x;render();if(lava>=100)gameOver()}function receiveGift(u,g){let r=c.rules.find(x=>x.n.toLowerCase()===String(g).toLowerCase());if(!r)return false;queue.push({id:Date.now()+Math.random(),u:norm(u),g:r.n,t:r.t,v:+r.v,at:Date.now()});render();return true}function receiveChat(u,m){if(String(m).trim().toLowerCase()!=='!claim')return false;u=norm(u);let i=queue.findIndex(x=>x.u===u);if(i<0)return false;let x=queue.splice(i,1)[0],d=x.t==='save'?-Math.abs(x.v):Math.abs(x.v);change(d);toast(x.u+' CLAIMED! '+(d>0?'+':'')+d+'%');return true}async function startGame(){if(state==='run')return;$('#over').style.display='none';let e=$('#count');e.style.display='flex';for(let x of ['3','2','1','GO!']){e.textContent=x;await new Promise(r=>setTimeout(r,650))}e.style.display='none';state='run';last=performance.now()}function pause(){state=state==='run'?'pause':'run';last=performance.now()}function surge(){boost=sec+10;next=sec+c.interval;toast('⚠ LAVA SURGE!')}function reset(){lava=c.start;sec=0;queue=[];shield=0;next=c.interval;boost=0;state='ready';$('#over').style.display='none';render()}function gameOver(){state='over';$('#over').style.display='flex'}function loop(n){let d=Math.min(.1,(n-last)/1000);last=n;if(state==='run'){sec+=d;if(sec>=next)surge();lava+=c.rise*(sec<boost?c.mult:1)*d;if(lava>=100)gameOver()}render();requestAnimationFrame(loop)}function admin(){['start','rise','expiry','interval','mult'].forEach(k=>{$('#'+k).value=c[k]});$('#so').textContent=c.start;$('#ro').textContent=c.rise;$('#eo').textContent=c.expiry;$('#io').textContent=c.interval;$('#mo').textContent=c.mult;$('#rules').innerHTML=c.rules.map((r,i)=>`<div class=rule><input data-i=${i} data-k=n value="${r.n}"><select data-i=${i} data-k=t><option ${r.t==='save'?'selected':''} value=save>Save</option><option ${r.t==='sabotage'?'selected':''} value=sabotage>Sabotage</option></select><input data-i=${i} data-k=v type=number value=${r.v}><button data-del=${i}>✕</button></div>`).join('')}$('#gear').onclick=()=>{$('#admin').style.display='block';admin()};$('#close').onclick=()=>$('#admin').style.display='none';['start','rise','expiry','interval','mult'].forEach(k=>$('#'+k).oninput=e=>{c[k]=+e.target.value;save();admin()});$('#rules').oninput=e=>{let i=e.target.dataset.i,k=e.target.dataset.k;if(k){c.rules[i][k]=k==='v'?+e.target.value:e.target.value;save()}};$('#rules').onclick=e=>{if(e.target.dataset.del!=null){c.rules.splice(+e.target.dataset.del,1);save();admin()}};$('#add').onclick=()=>{c.rules.push({n:'New Gift',t:'save',v:2});save();admin()};render();requestAnimationFrame(loop);setTimeout(startGame,300);window.receiveGift=receiveGift;window.receiveChat=receiveChat;</script></body></html>
